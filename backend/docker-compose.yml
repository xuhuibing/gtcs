version: '3.8'

services:
  backend:
    build: .
    container_name: gtcs-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    environment:
      - DATABASE_URL=sqlite:///data/gtcs.db
      - SECRET_KEY=change-this-in-production
      - CORS_ORIGINS=["*"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gtcs-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html/static
    depends_on:
      - backend
